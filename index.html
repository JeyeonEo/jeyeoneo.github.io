<script>
        const canvas = document.getElementById('hero-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let columns;
        const fontSize = 14;
        const hangeul = '불휘기픈남간바람에아니뮐쌔곶됴코여름하나니새미기픈믈은가말애아니그츨쌔내히이러바랄애가나니'.split('');
        const primaryColor = '#9caf9f';

        let maskPoints = [];
        let drops = [];

        const buddhaImg = new Image();
        buddhaImg.crossOrigin = "Anonymous";
        buddhaImg.src = 'https://lh3.googleusercontent.com/aida/AP1WRLvf7NymuzDO-pSksr11GWMReCvURhJkZYjBUF6s-ZKc36fqP8MsopPy6D54u4ocbim5wRqs6eOoVWWhe6Diu0pyxPnrGjHDOw7viXyKgDEsrKeIQQHE_706Umaiy76MeIyEu6I6ZQBgCCxE0p2v0dBPY1grJM8-lmeOo_z3knJYFIiDD9ZY1OZauZw_Jjm6fC6vnnO-4PVw2Os9Jie-fu55MwuuasX0Il5k_Zb8_ydohraJX6_kw4SmMY4';

        function initMask() {
            if (!buddhaImg.complete) return;

            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');

            const scaleFactor = Math.min(width / buddhaImg.width, height / buddhaImg.height) * 0.65;
            const targetWidth = buddhaImg.width * scaleFactor;
            const targetHeight = buddhaImg.height * scaleFactor;

            offCanvas.width = targetWidth;
            offCanvas.height = targetHeight;

            offCtx.drawImage(buddhaImg, 0, 0, targetWidth, targetHeight);
            const imgData = offCtx.getImageData(0, 0, targetWidth, targetHeight).data;

            maskPoints = [];
            const step = 3;
            for (let y = 0; y < targetHeight; y += step) {
                for (let x = 0; x < targetWidth; x += step) {
                    const idx = (y * targetWidth + x) * 4;
                    const r = imgData[idx];
                    const g = imgData[idx + 1];
                    const b = imgData[idx + 2];

                    const brightness = (r + g + b) / 3;
                    if (brightness > 40) {
                        maskPoints.push({
                            x: x + (width - targetWidth) / 2,
                            y: y + (height - targetHeight) / 2,
                            opacity: brightness / 255
                        });
                    }
                }
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / (fontSize * 0.8));
            drops = new Array(columns).fill(1).map(() => Math.random() * height / fontSize);
            initMask();
        }

        window.addEventListener('resize', resize);
        buddhaImg.onload = initMask;
        resize();

        function draw() {
            ctx.fillStyle = 'rgba(18, 20, 18, 0.15)';
            ctx.fillRect(0, 0, width, height);

            ctx.font = fontSize + 'px "JetBrains Mono"';

            for (let i = 0; i < drops.length; i++) {
                const text = hangeul[Math.floor(Math.random() * hangeul.length)];
                const x = i * (fontSize * 0.8);
                const y = drops[i] * fontSize;

                const opacity = 0.05 + (Math.random() * 0.15);
                ctx.fillStyle = `rgba(156, 175, 159, ${opacity})`;
                ctx.fillText(text, x, y);

                if (y > height && Math.random() > 0.985) {
                    drops[i] = 0;
                }
                drops[i] += 0.15;
            }

            ctx.shadowBlur = 12;
            ctx.shadowColor = primaryColor;

            maskPoints.forEach(p => {
                if (Math.random() > 0.05) {
                    const particleOpacity = 0.35 + (p.opacity * 0.45);
                    ctx.fillStyle = `rgba(156, 175, 159, ${particleOpacity})`;
                    ctx.fillRect(p.x, p.y, 1.4, 1.4);
                }
            });
            ctx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }

        draw();

        // Sidebar Toggle Logic
        const menuBtn = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function openSidebar() {
            sidebar.classList.remove('translate-x-full');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100', 'pointer-events-auto');
            document.body.classList.add('overflow-hidden');
        }
        function closeSidebar() {
            sidebar.classList.add('translate-x-full');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100', 'pointer-events-auto');
            document.body.classList.remove('overflow-hidden');
        }
        menuBtn.addEventListener('click', () => {
            sidebar.classList.contains('translate-x-full') ? openSidebar() : closeSidebar();
        });
        overlay.addEventListener('click', closeSidebar);
    </script>

<script>
    function renderZenSidebarList(containerId, items, getLabelFn, icon) {
        var container = document.getElementById(containerId);
        if (!container || !Array.isArray(items)) return;
        container.innerHTML = '';
        items.forEach(function(item) {
            var label = getLabelFn(item);
            if (!label || label === '-') return;
            var div = document.createElement('div');
            div.className = 'flex items-center px-4 py-1.5 text-on-surface-variant hover:text-primary-fixed-dim cursor-pointer transition-colors relative group/item';
            div.innerHTML = '<div class="absolute left-0 w-2 h-[1px] bg-primary-fixed-dim/20"></div>'
                + '<span class="material-symbols-outlined text-[14px] mr-2 opacity-60">' + icon + '</span>'
                + '<span class="">' + label.replace(/</g, '&lt;') + '</span>';
            container.appendChild(div);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        renderZenSidebarList('sidebar-projects-list',
            typeof PROJECTS !== 'undefined' ? PROJECTS : [],
            function(p) { return p.id || p.title; },
            'article');
        renderZenSidebarList('sidebar-papers-list',
            typeof PAPERS !== 'undefined' ? PAPERS : [],
            function(p) { return p.filename || p.title; },
            'description');
        renderZenSidebarList('sidebar-studies-list',
            typeof STUDIES !== 'undefined' ? STUDIES : [],
            function(s) { return (s && s.title && s.title !== '-') ? (s.sidebar_name || s.title) : null; },
            'auto_stories');
    });
</script>
