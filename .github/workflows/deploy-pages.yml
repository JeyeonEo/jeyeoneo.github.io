name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp .nojekyll dist/.nojekyll
          cp -R assets dist/assets
          cp -R data dist/data
          cp -R zen_matrix_soft_papers dist/zen_matrix_soft_papers
          cp -R zen_matrix_soft_about_me_toggle_nav dist/zen_matrix_soft_about_me_toggle_nav
          cp -R zen_matrix_soft_project_hub_toggle_nav_1 dist/zen_matrix_soft_project_hub_toggle_nav_1
          cp -R zen_matrix_soft_study_archive_toggle_nav dist/zen_matrix_soft_study_archive_toggle_nav
          cp -R zen_matrix_soft_landing_page_with_toggleable_right_nav dist/zen_matrix_soft_landing_page_with_toggleable_right_nav

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
